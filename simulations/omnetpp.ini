[General]
description = "Smart Campus Network Simulation"

# ============================================================
# Common settings across all scenarios
# ============================================================

# Network to simulate
network = myfirstnetwork.simulations.SmartCampusNetwork

# Simulation duration
sim-time-limit = 60s

# Configurator settings
*.configurator.dumpAddresses = true
*.configurator.dumpTopology = true
*.configurator.dumpLinks = true
*.configurator.dumpRoutes = true

# XML-based subnet configuration: separate subnets per router interface
*.configurator.config = xmldoc("campus-config.xml")

# ARP settings
*.*.ipv4.arp.typename = "GlobalArp"

# Routing - use netmask routes for simplicity
*.*.ipv4.routingTable.netmaskRoutes = ""

# ============================================================
# Server Application Configuration
# - Campus server runs multiple sink applications:
#   UDP sinks on ports 1000 (student), 2000 (teacher), 3000 (admin)
#   TCP server on port 4000 (admin priority)
# ============================================================
*.campusServer.numApps = 4

# UDP sink for student traffic (port 1000)
*.campusServer.app[0].typename = "UdpSink"
*.campusServer.app[0].localPort = 1000

# UDP sink for teacher traffic (port 2000)
*.campusServer.app[1].typename = "UdpSink"
*.campusServer.app[1].localPort = 2000

# UDP sink for admin traffic (port 3000)
*.campusServer.app[2].typename = "UdpSink"
*.campusServer.app[2].localPort = 3000

# TCP server for admin priority access (port 4000)
*.campusServer.app[3].typename = "TcpGenericServerApp"
*.campusServer.app[3].localPort = 4000

# ============================================================
# Visualizer settings
# ============================================================
*.visualizer.interfaceTableVisualizer.displayInterfaceTables = true
*.visualizer.interfaceTableVisualizer.nodeFilter = "not (*Switch* or *switch*)"
*.visualizer.routingTableVisualizer.displayRoutingTables = true
*.visualizer.routingTableVisualizer.destinationFilter = "campusServer"
*.visualizer.packetDropVisualizer.displayPacketDrops = true
*.visualizer.dataLinkVisualizer.displayDataLinks = true
*.visualizer.physicalLinkVisualizer.displayPhysicalLinks = true

# ============================================================
# SCENARIO 1: Normal Traffic
# ============================================================
# Light traffic from all user types to campus server.
# Students send UDP data, Teachers send UDP data, Admins send ping.
# Purpose: Measure baseline delay and throughput.
# ============================================================
[Config Scenario1_NormalTraffic]
description = "Normal traffic - students and teachers accessing campus server"

# --- Student applications (UDP to port 1000) ---
*.student?.numApps = 1
*.student?.app[0].typename = "UdpBasicApp"
*.student?.app[0].destAddresses = "campusServer"
*.student?.app[0].destPort = 1000
*.student?.app[0].messageLength = 512B
*.student?.app[0].sendInterval = exponential(0.5s)
*.student?.app[0].startTime = 1s
*.student?.app[0].stopTime = 55s

# --- Teacher applications (UDP to port 2000, larger packets) ---
*.teacher1.numApps = 1
*.teacher1.app[0].typename = "UdpBasicApp"
*.teacher1.app[0].destAddresses = "campusServer"
*.teacher1.app[0].destPort = 2000
*.teacher1.app[0].messageLength = 1024B
*.teacher1.app[0].sendInterval = exponential(1s)
*.teacher1.app[0].startTime = 2s
*.teacher1.app[0].stopTime = 55s

*.teacher2.numApps = 1
*.teacher2.app[0].typename = "UdpBasicApp"
*.teacher2.app[0].destAddresses = "campusServer"
*.teacher2.app[0].destPort = 2000
*.teacher2.app[0].messageLength = 1024B
*.teacher2.app[0].sendInterval = exponential(1s)
*.teacher2.app[0].startTime = 3s
*.teacher2.app[0].stopTime = 55s

# --- Admin applications (light ping to verify connectivity) ---
*.admin?.numApps = 1
*.admin?.app[0].typename = "PingApp"
*.admin?.app[0].destAddr = "campusServer"
*.admin?.app[0].startTime = 1s
*.admin?.app[0].sendInterval = 5s
*.admin?.app[0].count = 10
*.admin?.app[0].packetSize = 256B

# ============================================================
# SCENARIO 2: High Load / Congestion
# ============================================================
# Heavy traffic from students flooding the campus server.
# High packet rate causes queue buildup at router and switch.
# Purpose: Observe congestion behavior, packet loss, increased delay.
# ============================================================
[Config Scenario2_HighLoad]
description = "High load scenario - student traffic flood causing congestion"

# --- Student applications (HIGH RATE: very short intervals) ---
*.student?.numApps = 2
# App 0: Aggressive UDP burst traffic
*.student?.app[0].typename = "UdpBasicApp"
*.student?.app[0].destAddresses = "campusServer"
*.student?.app[0].destPort = 1000
*.student?.app[0].messageLength = 1500B
*.student?.app[0].sendInterval = exponential(50ms)
*.student?.app[0].startTime = uniform(0.5s, 2s)
*.student?.app[0].stopTime = 55s
# App 1: Secondary UDP stream (even more aggressive)
*.student?.app[1].typename = "UdpBasicApp"
*.student?.app[1].destAddresses = "campusServer"
*.student?.app[1].destPort = 1000
*.student?.app[1].messageLength = 1500B
*.student?.app[1].sendInterval = exponential(80ms)
*.student?.app[1].startTime = uniform(1s, 3s)
*.student?.app[1].stopTime = 55s

# --- Teacher applications (UDP, moderate rate - also affected) ---
*.teacher1.numApps = 1
*.teacher1.app[0].typename = "UdpBasicApp"
*.teacher1.app[0].destAddresses = "campusServer"
*.teacher1.app[0].destPort = 2000
*.teacher1.app[0].messageLength = 1024B
*.teacher1.app[0].sendInterval = exponential(300ms)
*.teacher1.app[0].startTime = 2s
*.teacher1.app[0].stopTime = 55s

*.teacher2.numApps = 1
*.teacher2.app[0].typename = "UdpBasicApp"
*.teacher2.app[0].destAddresses = "campusServer"
*.teacher2.app[0].destPort = 2000
*.teacher2.app[0].messageLength = 1024B
*.teacher2.app[0].sendInterval = exponential(300ms)
*.teacher2.app[0].startTime = 3s
*.teacher2.app[0].stopTime = 55s

# --- Admin applications (light ping, should see impact) ---
*.admin?.numApps = 1
*.admin?.app[0].typename = "PingApp"
*.admin?.app[0].destAddr = "campusServer"
*.admin?.app[0].startTime = 1s
*.admin?.app[0].sendInterval = 3s
*.admin?.app[0].count = 15
*.admin?.app[0].packetSize = 256B

# ============================================================
# SCENARIO 3: Priority Traffic Test
# ============================================================
# Heavy student load + admin priority traffic.
# Admin traffic uses DSCP-based QoS to get priority treatment.
# Students flood, teachers moderate, admin DSCP=46 (EF/Expedited Forwarding).
# Purpose: Verify that admin traffic experiences lower delay
#          even under congestion.
# ============================================================
[Config Scenario3_PriorityTest]
description = "Priority test - admin traffic gets QoS priority during congestion"

# --- Student applications (UDP flood - same as Scenario 2) ---
*.student?.numApps = 2
*.student?.app[0].typename = "UdpBasicApp"
*.student?.app[0].destAddresses = "campusServer"
*.student?.app[0].destPort = 1000
*.student?.app[0].messageLength = 1500B
*.student?.app[0].sendInterval = exponential(50ms)
*.student?.app[0].startTime = 0.5s
*.student?.app[0].stopTime = 55s
# Student traffic: best-effort DSCP (0 = default)
*.student?.app[0].dscp = 0

*.student?.app[1].typename = "UdpBasicApp"
*.student?.app[1].destAddresses = "campusServer"
*.student?.app[1].destPort = 1000
*.student?.app[1].messageLength = 1500B
*.student?.app[1].sendInterval = exponential(80ms)
*.student?.app[1].startTime = 2s
*.student?.app[1].stopTime = 55s
*.student?.app[1].dscp = 0

# --- Teacher applications (UDP, lower DSCP priority than admin) ---
*.teacher1.numApps = 1
*.teacher1.app[0].typename = "UdpBasicApp"
*.teacher1.app[0].destAddresses = "campusServer"
*.teacher1.app[0].destPort = 2000
*.teacher1.app[0].messageLength = 1024B
*.teacher1.app[0].sendInterval = exponential(300ms)
*.teacher1.app[0].startTime = 2s
*.teacher1.app[0].stopTime = 55s
# Teacher traffic: medium priority DSCP (26 = AF31)
*.teacher1.app[0].dscp = 26

*.teacher2.numApps = 1
*.teacher2.app[0].typename = "UdpBasicApp"
*.teacher2.app[0].destAddresses = "campusServer"
*.teacher2.app[0].destPort = 2000
*.teacher2.app[0].messageLength = 1024B
*.teacher2.app[0].sendInterval = exponential(300ms)
*.teacher2.app[0].startTime = 3s
*.teacher2.app[0].stopTime = 55s
*.teacher2.app[0].dscp = 26

# --- Admin applications (HIGH PRIORITY: DSCP=46 EF) ---
# Admin 1: UDP with expedited forwarding
*.admin1.numApps = 1
*.admin1.app[0].typename = "UdpBasicApp"
*.admin1.app[0].destAddresses = "campusServer"
*.admin1.app[0].destPort = 3000
*.admin1.app[0].messageLength = 512B
*.admin1.app[0].sendInterval = exponential(200ms)
*.admin1.app[0].startTime = 5s
*.admin1.app[0].stopTime = 55s
*.admin1.app[0].dscp = 46

# Admin 2: Ping with high priority
*.admin2.numApps = 1
*.admin2.app[0].typename = "PingApp"
*.admin2.app[0].destAddr = "campusServer"
*.admin2.app[0].startTime = 5s
*.admin2.app[0].sendInterval = 2s
*.admin2.app[0].count = 20
*.admin2.app[0].packetSize = 256B

# ============================================================
# SCENARIO 4: TCP vs UDP Comparison
# ============================================================
# Compare TCP (reliable) vs UDP (unreliable) performance.
# 2 students use TCP, 2 students use UDP — compare delay and throughput.
# Purpose: Analyze protocol-level performance differences.
# ============================================================
[Config Scenario4_TCPvsUDP]
description = "TCP vs UDP comparison - reliable vs unreliable transport"

# --- Student 1 and 2: TCP clients (request/reply pattern) ---
*.student1.numApps = 1
*.student1.app[0].typename = "TcpBasicClientApp"
*.student1.app[0].connectAddress = "campusServer"
*.student1.app[0].connectPort = 4000
*.student1.app[0].numRequestsPerSession = int(exponential(5))
*.student1.app[0].requestLength = 512B
*.student1.app[0].replyLength = int(exponential(100KiB))
*.student1.app[0].thinkTime = exponential(100ms)
*.student1.app[0].idleInterval = exponential(2s)
*.student1.app[0].startTime = 1s
*.student1.app[0].stopTime = 55s

*.student2.numApps = 1
*.student2.app[0].typename = "TcpBasicClientApp"
*.student2.app[0].connectAddress = "campusServer"
*.student2.app[0].connectPort = 4000
*.student2.app[0].numRequestsPerSession = int(exponential(5))
*.student2.app[0].requestLength = 512B
*.student2.app[0].replyLength = int(exponential(100KiB))
*.student2.app[0].thinkTime = exponential(100ms)
*.student2.app[0].idleInterval = exponential(2s)
*.student2.app[0].startTime = 2s
*.student2.app[0].stopTime = 55s

# --- Student 3 and 4: UDP clients ---
*.student3.numApps = 1
*.student3.app[0].typename = "UdpBasicApp"
*.student3.app[0].destAddresses = "campusServer"
*.student3.app[0].destPort = 1000
*.student3.app[0].messageLength = 1024B
*.student3.app[0].sendInterval = exponential(100ms)
*.student3.app[0].startTime = 1s
*.student3.app[0].stopTime = 55s

*.student4.numApps = 1
*.student4.app[0].typename = "UdpBasicApp"
*.student4.app[0].destAddresses = "campusServer"
*.student4.app[0].destPort = 1000
*.student4.app[0].messageLength = 1024B
*.student4.app[0].sendInterval = exponential(100ms)
*.student4.app[0].startTime = 2s
*.student4.app[0].stopTime = 55s

# --- Teachers - UDP (moderate) ---
*.teacher?.numApps = 1
*.teacher?.app[0].typename = "UdpBasicApp"
*.teacher?.app[0].destAddresses = "campusServer"
*.teacher?.app[0].destPort = 2000
*.teacher?.app[0].messageLength = 1024B
*.teacher?.app[0].sendInterval = exponential(500ms)
*.teacher?.app[0].startTime = uniform(1s, 3s)
*.teacher?.app[0].stopTime = 55s

# --- Admin - light ping ---
*.admin?.numApps = 1
*.admin?.app[0].typename = "PingApp"
*.admin?.app[0].destAddr = "campusServer"
*.admin?.app[0].startTime = 1s
*.admin?.app[0].sendInterval = 10s
*.admin?.app[0].count = 5
*.admin?.app[0].packetSize = 256B

# ============================================================
# SCENARIO 5: Firewall / Access Control
# ============================================================
# Demonstrates subnet-level access control, modeling Linux
# iptables firewall rules on the core router.
#
# Firewall Rules:
#   Students → Server ONLY (blocked from Teachers and Admins)
#   Teachers → Server + Admins (blocked from Students)
#   Admins   → Everything (full access)
#   Server   → Everything (for reply traffic)
#
# This scenario uses campus-firewall.xml which contains
# explicit allow-list routes. Default routes are disabled
# so any traffic not explicitly allowed is DROPPED.
# Purpose: Verify that unauthorized cross-subnet traffic
#          is blocked by the router (like iptables DROP).
# ============================================================
[Config Scenario5_Firewall]
description = "Firewall access control - students restricted to server only"

# Use firewall config with explicit routes
*.configurator.config = xmldoc("campus-firewall.xml")

# Disable automatic route generation (only explicit routes used)
*.configurator.addStaticRoutes = false
*.configurator.addDefaultRoutes = false

# === FIREWALL TEST TRAFFIC ===

# Test 1: Students try to ping Teacher1 (SHOULD FAIL - blocked by firewall)
*.student1.numApps = 1
*.student1.app[0].typename = "PingApp"
*.student1.app[0].destAddr = "teacher1"
*.student1.app[0].startTime = 2s
*.student1.app[0].sendInterval = 3s
*.student1.app[0].count = 5
*.student1.app[0].packetSize = 256B

# Test 2: Student2 pings Server (SHOULD SUCCEED - allowed route exists)
*.student2.numApps = 1
*.student2.app[0].typename = "PingApp"
*.student2.app[0].destAddr = "campusServer"
*.student2.app[0].startTime = 2s
*.student2.app[0].sendInterval = 3s
*.student2.app[0].count = 5
*.student2.app[0].packetSize = 256B

# Test 3: Teacher1 pings Admin1 (SHOULD SUCCEED - allowed route exists)
*.teacher1.numApps = 1
*.teacher1.app[0].typename = "PingApp"
*.teacher1.app[0].destAddr = "admin1"
*.teacher1.app[0].startTime = 2s
*.teacher1.app[0].sendInterval = 3s
*.teacher1.app[0].count = 5
*.teacher1.app[0].packetSize = 256B

# Test 4: Admin1 pings Student1 (SHOULD SUCCEED - admin has full access)
*.admin1.numApps = 1
*.admin1.app[0].typename = "PingApp"
*.admin1.app[0].destAddr = "student1"
*.admin1.app[0].startTime = 2s
*.admin1.app[0].sendInterval = 3s
*.admin1.app[0].count = 5
*.admin1.app[0].packetSize = 256B

# Test 5: UDP from students to Server (SHOULD SUCCEED - allowed)
*.student3.numApps = 1
*.student3.app[0].typename = "UdpBasicApp"
*.student3.app[0].destAddresses = "campusServer"
*.student3.app[0].destPort = 1000
*.student3.app[0].messageLength = 512B
*.student3.app[0].sendInterval = exponential(500ms)
*.student3.app[0].startTime = 3s
*.student3.app[0].stopTime = 55s

# Visualizer: show routing tables to verify firewall rules
*.visualizer.routingTableVisualizer.displayRoutingTables = true
*.visualizer.routingTableVisualizer.destinationFilter = "*"
*.visualizer.routingTableVisualizer.displayRoutesIndividually = false
